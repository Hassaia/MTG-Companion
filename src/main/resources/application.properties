spring.application.name=mtg-companion

# Fichier de sauvegarde de la partie (chemin relatif au dossier de lancement du serveur)
mtg.state-file=mtg-game-state.json

# Images envoyées par les joueurs (bibliothèque partagée) et leurs cadrages ; à sauvegarder comme la partie
mtg.user-images-dir=user-images
mtg.player-art-file=mtg-player-art.json

# Cartes Magic : API Scryfall et cache sur disque des cartes et images déjà affichées
mtg.scryfall.base-url=https://api.scryfall.com
mtg.card-cache-dir=card-cache
# Durée d'affichage d'une carte sur la table avant fermeture automatique
mtg.card-display-duration=30s

# Les navigateurs revérifient les pages et scripts à chaque chargement (réponse 304 s'ils n'ont pas changé) :
# sans cela, un onglet rechargé peut garder d'anciens fichiers JavaScript après une mise à jour du serveur.
spring.web.resources.cache.cachecontrol.no-cache=true
